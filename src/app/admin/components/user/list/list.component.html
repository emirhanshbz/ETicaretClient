<div class="order-list-container mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" class="order-table">

    <ng-container matColumnDef="userName">
      <th mat-header-cell *matHeaderCellDef>Kullanıcı Adı</th>
      <td mat-cell *matCellDef="let element">{{ element.userName }}</td>
    </ng-container>


    <ng-container matColumnDef="nameSurname">
      <th mat-header-cell *matHeaderCellDef>Ad Soyad</th>
      <td mat-cell *matCellDef="let element">{{ element.nameSurname }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let element">{{ element.email }}</td>
    </ng-container>

    <ng-container matColumnDef="twoFactorEnabled">
      <th mat-header-cell *matHeaderCellDef>2FA</th>
      <td mat-cell *matCellDef="let element">
        <img [src]="element.twoFactorEnabled ? 'assets/enabled.png' : 'assets/disabled.png'" width="20" height="20">
      </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <button mat-button color="primary" (click)="assignRole(element.id)">Rol Ata</button>
      </td>
    </ng-container>



    <!-- Delete -->
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element" 
          appDelete 
          [id]="element.id" 
          (callBack)="getUsers()" 
          controller="users">
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator 
    (page)="pageChanged()" 
    [pageSizeOptions]="[5, 10, 20]" 
    showFirstLastButtons
    aria-label="Sayfa seçimi">
  </mat-paginator>
</div>
