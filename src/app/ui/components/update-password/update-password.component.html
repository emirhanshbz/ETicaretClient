<div class="container mt-5" *ngIf="state.state">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg">
        <div class="card-body">
          <h4 class="text-center mb-4">Şifreyi Güncelle</h4>

          <p class="text-muted text-center">Yeni şifrenizi girin ve onaylayın.</p>

          <form>
            <div class="form-group mb-3">
              <label for="password">Yeni Şifre</label>
              <input type="password" id="password" #txtPassword class="form-control" placeholder="Yeni şifre" required
                minlength="6">
            </div>

            <div class="form-group mb-3">
              <label for="passwordConfirm">Yeni Şifre (Tekrar)</label>
              <input type="password" id="passwordConfirm" #txtPasswordConfirm class="form-control"
                placeholder="Yeni şifreyi tekrar girin" required minlength="6">
            </div>

            <!-- Hata veya başarı mesajı için buraya alert eklenebilir -->
            <!-- <div class="alert alert-danger" role="alert">Şifreler uyuşmuyor.</div> -->

            <button type="submit" class="btn btn-success w-100"
              (click)="updatePassword(txtPassword.value, txtPasswordConfirm.value)">Şifreyi Güncelle</button>
          </form>

          <div class="text-center mt-3">
            <a href="/login">Giriş ekranına dön</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="alert alert-danger" role="alert" *ngIf="!state.state">
  Bu link kullanılamaz. Lütfen şifre sıfırlama bağlantısını kontrol edin veya yeni bir bağlantı isteyin.
</div>
