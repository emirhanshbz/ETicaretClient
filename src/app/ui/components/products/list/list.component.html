<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ürün Listesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="page-wrapper">
    <main class="main-content">
      <div class="card-container">
        <div class="card" *ngFor="let product of products;">
          <img *ngIf="product.imagePath" [src]="baseUrl.url + '/' + product.imagePath" class="card-img-top"
            [alt]="product.name" />
          <img *ngIf="!product.imagePath" src="../../../../assets/default_product.png" class="card-img-top"
            [alt]="product.name" />

          <div class="card-body">
            <h5 class="card-title">{{product.name}}</h5>
            <p class="card-text">
              {{ formatPrice(product.price) }}
              <span *ngIf="stockStatus(product.stock)" style="color: red; font-weight: bold;">
                <br> {{ stockStatus(product.stock) }}
              </span>
            </p>

            <a class="btn btn-primary" (click)="addToBasket(product)">Sepete Ekle</a>
          </div>
        </div>
        <!-- İstersen başka kartlar da ekleyebilirsin -->
      </div>
    </main>

    <footer class="pagination-footer">
      <nav aria-label="Sayfa Geçişleri">
        <ul class="pagination">
          <li class="page-item"><a class="page-link"
              [routerLink]="['/products', currentPageNo - 1 <= 0 ? 1 : currentPageNo - 1]">Previous</a></li>
          <li class="page-item" *ngFor="let pageNo of pageList;" routerLinkActive="active"><a class="page-link"
              [routerLink]="['/products', pageNo]">{{pageNo}}</a></li>
          <li class="page-item"><a class="page-link"
              [routerLink]="['/products', currentPageNo + 1 >= totalPageCount ? totalPageCount : currentPageNo + 1]">Next</a>
          </li>
        </ul>
      </nav>
    </footer>
  </div>
</body>

</html>
