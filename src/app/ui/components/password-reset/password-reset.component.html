<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg">
        <div class="card-body">
          <h4 class="text-center mb-4">Şifremi Unuttum</h4>

          <p class="text-muted text-center">Şifrenizi sıfırlamak için e-posta adresinizi giriniz.</p>

          <form>
            <div class="form-group">
              <label for="email">E-posta Adresi</label>
              <input type="email" #txtEmail id="email" class="form-control" placeholder="E-posta adresinizi girin" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3" (click)="passwordReset(txtEmail.value)">Şifre Sıfırlama Linki Gönder</button>
          </form>

          <div class="text-center mt-3">
            <a href="/login">Giriş ekranına dön</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
