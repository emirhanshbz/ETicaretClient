<h2 mat-dialog-title>{{ data.name }} Endpoint'ine Rol Atama</h2>
<div mat-dialog-content>
  <p>Atamak istediğiniz rolleri aşağıdan seçiniz</p>
</div>


<mat-selection-list #rolesComponent>
  <mat-list-option *ngFor="let role of listRoles" selected="{{role.selected}}">
    {{role.name}}
  </mat-list-option>
</mat-selection-list>



<div></div>
<div mat-dialog-actions>
  <button mat-button (click)="close()">İptal</button>
  <button mat-button [mat-dialog-close]="data" cdkFocusInitial (click)="assignRoles(rolesComponent)">Onayla</button>
</div>
